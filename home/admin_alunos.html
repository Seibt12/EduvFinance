<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerenciar Alunos — EduvFinance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); background: var(--bg-base); color: var(--text-primary); min-height: 100vh; display: flex; overflow-x: hidden; }

/* ── Sidebar ── */
.sidebar { width: var(--sidebar-width); flex-shrink: 0; height: 100vh; position: sticky; top: 0; display: flex; flex-direction: column; background: var(--bg-surface); border-right: 1px solid var(--border); overflow-y: auto; overflow-x: hidden; z-index: 40; transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); }
.sidebar-logo { padding: 24px 20px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sidebar-logo h2 { font-size: var(--text-lg); font-weight: var(--weight-bold); background: var(--gradient-text); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -0.02em; }
.sidebar-logo .site-sub { font-size: var(--text-xs); color: var(--text-muted); margin-top: 2px; }
.sidebar-user { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.user-avatar { width: 36px; height: 36px; border-radius: var(--radius-full); background: linear-gradient(135deg,#7B5FFF,#4F7CFF); display: flex; align-items: center; justify-content: center; font-size: var(--text-sm); font-weight: var(--weight-bold); color: #fff; flex-shrink: 0; box-shadow: 0 4px 12px rgba(123,95,255,.4); }
.sidebar-user-info { min-width: 0; }
.user-name { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-role { font-size: var(--text-xs); color: var(--text-muted); margin-top: 1px; }
.role-badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: var(--radius-full); font-size: 10px; font-weight: var(--weight-semibold); letter-spacing: .04em; text-transform: uppercase; background: rgba(123,95,255,.15); color: #A78BFA; border: 1px solid rgba(123,95,255,.3); }
.sidebar-section-label { padding: 12px 12px 6px; font-size: 10px; font-weight: var(--weight-semibold); color: var(--text-muted); letter-spacing: .08em; text-transform: uppercase; }
.sidebar-menu { list-style: none; padding: 12px 10px; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.sidebar-menu li a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-md); font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--text-secondary); text-decoration: none; transition: var(--transition-base); }
.sidebar-menu li a svg { width: 17px; height: 17px; flex-shrink: 0; opacity: .7; }
.sidebar-menu li a:hover { background: var(--bg-hover); color: var(--text-primary); }
.sidebar-menu li a:hover svg { opacity: 1; }
.sidebar-menu li.active a { background: var(--primary-subtle); color: var(--primary); font-weight: var(--weight-semibold); }
.sidebar-menu li.active a svg { opacity: 1; color: var(--primary); }
.sidebar-footer { padding: 12px 10px 16px; border-top: 1px solid var(--border); flex-shrink: 0; }
.btn-logout { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-md); background: none; border: none; cursor: pointer; font-family: var(--font-sans); font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--text-muted); transition: var(--transition-base); text-align: left; }
.btn-logout svg { width: 17px; height: 17px; flex-shrink: 0; }
.btn-logout:hover { background: var(--danger-subtle); color: var(--danger); }
.sidebar-toggle { display: none; position: fixed; top: 14px; left: 14px; z-index: 60; width: 40px; height: 40px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); cursor: pointer; align-items: center; justify-content: center; color: var(--text-secondary); transition: var(--transition-base); }
.sidebar-toggle svg { width: 18px; height: 18px; }
.sidebar-backdrop { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 39; backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .3s ease; }
.sidebar-backdrop.visible { opacity: 1; pointer-events: auto; }

/* ── Content ── */
.content { flex: 1; min-width: 0; padding: var(--content-padding); display: flex; flex-direction: column; gap: 24px; }

.page-header h1 { font-size: var(--text-2xl); font-weight: var(--weight-bold); letter-spacing: -0.02em; }
.page-header p { font-size: var(--text-sm); color: var(--text-muted); margin-top: 4px; }

/* ── Cards ── */
.card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden; }
.card-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--border); gap: 12px; flex-wrap: wrap; }
.card-header h2 { font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--text-primary); letter-spacing: -0.01em; }
.card-body { padding: 24px; }

/* ── Form ── */
.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--text-secondary); margin-bottom: 8px; }
.form-group input, .form-group textarea, .form-group select {
  width: 100%; background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: var(--radius-md); color: var(--text-primary);
  font-family: var(--font-sans); font-size: var(--text-base);
  padding: 11px 14px; transition: var(--transition-base); outline: none;
}
.form-group input::placeholder, .form-group textarea::placeholder { color: var(--text-muted); }
.form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--border-focus); background: var(--bg-overlay); box-shadow: 0 0 0 3px var(--primary-glow); }
.form-group textarea { resize: vertical; min-height: 80px; }
.form-group select option { background: var(--bg-elevated); }

.form-actions { display: flex; gap: 10px; flex-wrap: wrap; padding-top: 4px; }

.btn-submit { display: inline-flex; align-items: center; gap: 7px; padding: 10px 20px; background: var(--gradient-primary); border: none; border-radius: var(--radius-md); color: #fff; font-family: var(--font-sans); font-size: var(--text-sm); font-weight: var(--weight-semibold); cursor: pointer; box-shadow: var(--shadow-primary); transition: var(--transition-smooth); }
.btn-submit:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn-submit svg { width: 15px; height: 15px; }

.btn-cancel { display: inline-flex; align-items: center; gap: 7px; padding: 10px 18px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-secondary); font-family: var(--font-sans); font-size: var(--text-sm); font-weight: var(--weight-medium); cursor: pointer; transition: var(--transition-base); }
.btn-cancel:hover { background: var(--bg-overlay); color: var(--text-primary); }
.btn-cancel svg { width: 15px; height: 15px; }

/* ── Table ── */
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.table thead tr { background: var(--bg-elevated); border-bottom: 1px solid var(--border); }
.table th { padding: 12px 16px; text-align: left; font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.table td { padding: 14px 16px; border-bottom: 1px solid var(--border-subtle); color: var(--text-secondary); vertical-align: middle; }
.table tbody tr:last-child td { border-bottom: none; }
.table tbody tr { transition: var(--transition-fast); }
.table tbody tr:hover td { background: var(--bg-hover); color: var(--text-primary); }

.progress-wrap { display: flex; align-items: center; gap: 10px; min-width: 140px; }
.progress-bar { flex: 1; height: 6px; background: var(--border); border-radius: var(--radius-full); overflow: hidden; }
.progress-fill { height: 100%; background: var(--gradient-primary); border-radius: var(--radius-full); }
.progress-label { font-size: var(--text-xs); color: var(--text-muted); white-space: nowrap; min-width: 36px; text-align: right; }

.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn-edit { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: var(--radius-sm); font-family: var(--font-sans); font-size: var(--text-xs); font-weight: var(--weight-medium); cursor: pointer; border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text-secondary); transition: var(--transition-base); }
.btn-edit:hover { background: var(--primary-subtle); color: var(--primary); border-color: var(--primary-border); }
.btn-del { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; border-radius: var(--radius-sm); font-family: var(--font-sans); font-size: var(--text-xs); font-weight: var(--weight-medium); cursor: pointer; border: 1px solid var(--danger-border); background: var(--danger-subtle); color: var(--danger); transition: var(--transition-base); }
.btn-del:hover { background: var(--danger); color: #fff; }

/* ── Responsive ── */
@media (max-width: 900px) {
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); box-shadow: var(--shadow-xl); }
  .sidebar.open { transform: translateX(0); }
  .sidebar-toggle { display: flex; }
  .content { padding: 16px; padding-top: 68px; }
}
@media (max-width: 600px) {
  .card-body { padding: 16px; }
  .actions { flex-direction: column; align-items: flex-start; gap: 6px; }
  .btn-edit, .btn-del { width: 100%; justify-content: center; }
}
</style>
</head>
<body>

<button class="sidebar-toggle" id="sidebarToggle"><i data-lucide="menu"></i></button>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <h2>EduvFinance</h2>
    <p class="site-sub">Educação Financeira</p>
  </div>
  <div class="sidebar-user">
    <div class="user-avatar" id="userAvatar">A</div>
    <div class="sidebar-user-info">
      <div class="user-name" id="userName"></div>
      <div class="user-role"><span class="role-badge">Admin</span></div>
    </div>
  </div>
  <div class="sidebar-section-label">Gestão</div>
  <ul class="sidebar-menu">
    <li><a href="index.html"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a></li>
    <li class="active"><a href="admin_alunos.html"><i data-lucide="users"></i><span>Alunos</span></a></li>
    <li><a href="admin_professores.html"><i data-lucide="user-check"></i><span>Professores</span></a></li>
    <li><a href="admin_cursos.html"><i data-lucide="check-square"></i><span>Aprovar Cursos</span></a></li>
  </ul>
  <div class="sidebar-footer">
    <button onclick="logout()" class="btn-logout"><i data-lucide="log-out"></i><span>Sair</span></button>
  </div>
</nav>

<main class="content">

  <div class="page-header">
    <h1>Gerenciar Alunos</h1>
  </div>

  <!-- Formulário de edição — IDs preservados -->
  <div class="card" id="formEdicaoAluno" style="display:none">
    <div class="card-header">
      <h2>Editar Aluno</h2>
      <button type="button" class="btn-cancel" onclick="cancelarEdicaoAluno()">
        <i data-lucide="x"></i> Fechar
      </button>
    </div>
    <div class="card-body">
      <form method="POST" action="../php/users_atualizar.php">
        <input type="hidden" name="id" id="editAlunoId">
        <div class="form-group">
          <label>Nome</label>
          <input type="text" name="nome" id="editAlunoNome" required>
        </div>
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" name="email" id="editAlunoEmail" required>
        </div>
        <div class="form-group">
          <label>Nova senha <span style="font-weight:400;color:var(--text-muted)">(deixe em branco para manter)</span></label>
          <input type="password" name="senha" id="editAlunoSenha" placeholder="••••••••">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-submit"><i data-lucide="save"></i> Salvar</button>
          <button type="button" class="btn-cancel" onclick="cancelarEdicaoAluno()"><i data-lucide="x"></i> Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Lista de alunos -->
  <div class="card">
    <div class="card-header">
      <h2>Lista de Alunos (<span id="contadorAlunos">0</span>)</h2>
    </div>
    <div class="card-body" style="padding:0">
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr><th>Nome</th><th>E-mail</th><th>Progresso</th><th>Cadastrado em</th><th>Ações</th></tr>
          </thead>
          <tbody id="alunosBody">
            <tr><td colspan="5" style="padding:40px;text-align:center;color:var(--text-muted)">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</main>

<script src="../assets/js/utils.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
lucide.createIcons();

const sidebarToggle = document.getElementById('sidebarToggle');
const sidebar = document.getElementById('sidebar');
const sidebarBackdrop = document.getElementById('sidebarBackdrop');
sidebarToggle.addEventListener('click', () => { sidebar.classList.toggle('open'); sidebarBackdrop.classList.toggle('visible'); });
sidebarBackdrop.addEventListener('click', () => { sidebar.classList.remove('open'); sidebarBackdrop.classList.remove('visible'); });

verificarSessao('admin', usuario => {
  document.getElementById('userName').textContent = usuario.nome;
  const inicial = usuario.nome ? usuario.nome.charAt(0).toUpperCase() : 'A';
  document.getElementById('userAvatar').textContent = inicial;

  const params = new URLSearchParams(window.location.search);
  if (params.get('sucesso')) exibirToast(params.get('sucesso'), 'success');
  if (params.get('erro'))    exibirToast(params.get('erro'), 'error');

  carregarAlunos().then(() => lucide.createIcons());
});
</script>
</body>
</html>
