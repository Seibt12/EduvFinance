<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursos — EduvFinance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-sans);
  background: var(--bg-base);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  overflow-x: hidden;
}

/* ── Sidebar (igual ao student.html) ─────────────────────── */
.sidebar {
  width: var(--sidebar-width);
  flex-shrink: 0;
  height: 100vh;
  position: sticky;
  top: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg-surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  overflow-x: hidden;
  z-index: 40;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.sidebar-logo {
  padding: 24px 20px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sidebar-logo h2 {
  font-size: var(--text-lg);
  font-weight: var(--weight-bold);
  background: var(--gradient-text);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.02em;
}
.sidebar-logo .site-sub { font-size: var(--text-xs); color: var(--text-muted); margin-top: 2px; }

.sidebar-user {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.user-avatar {
  width: 36px; height: 36px;
  border-radius: var(--radius-full);
  background: var(--gradient-primary);
  display: flex; align-items: center; justify-content: center;
  font-size: var(--text-sm); font-weight: var(--weight-bold); color: #fff;
  flex-shrink: 0; box-shadow: var(--shadow-primary);
}
.sidebar-user-info { min-width: 0; }
.user-name { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-role { font-size: var(--text-xs); color: var(--text-muted); margin-top: 1px; }

.sidebar-menu { list-style: none; padding: 12px 10px; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.sidebar-menu li a {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: var(--radius-md);
  font-size: var(--text-sm); font-weight: var(--weight-medium);
  color: var(--text-secondary); text-decoration: none;
  transition: var(--transition-base);
}
.sidebar-menu li a svg { width: 17px; height: 17px; flex-shrink: 0; opacity: 0.7; }
.sidebar-menu li a:hover { background: var(--bg-hover); color: var(--text-primary); }
.sidebar-menu li a:hover svg { opacity: 1; }
.sidebar-menu li.active a { background: var(--primary-subtle); color: var(--primary); font-weight: var(--weight-semibold); }
.sidebar-menu li.active a svg { opacity: 1; color: var(--primary); }

.sidebar-footer { padding: 12px 10px 16px; border-top: 1px solid var(--border); flex-shrink: 0; }
.btn-logout {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: var(--radius-md);
  background: none; border: none; cursor: pointer;
  font-family: var(--font-sans); font-size: var(--text-sm);
  font-weight: var(--weight-medium); color: var(--text-muted);
  transition: var(--transition-base); text-align: left;
}
.btn-logout svg { width: 17px; height: 17px; flex-shrink: 0; }
.btn-logout:hover { background: var(--danger-subtle); color: var(--danger); }

.sidebar-toggle {
  display: none;
  position: fixed; top: 14px; left: 14px; z-index: 60;
  width: 40px; height: 40px;
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); cursor: pointer;
  align-items: center; justify-content: center;
  color: var(--text-secondary); transition: var(--transition-base);
}
.sidebar-toggle:hover { background: var(--bg-elevated); color: var(--text-primary); }
.sidebar-toggle svg { width: 18px; height: 18px; }

.sidebar-backdrop {
  display: block; position: fixed; inset: 0;
  background: rgba(0,0,0,0.6); z-index: 39;
  backdrop-filter: blur(2px);
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
.sidebar-backdrop.visible { opacity: 1; pointer-events: auto; }

/* ── Main Content ─────────────────────────────────────────── */
.content {
  flex: 1; min-width: 0;
  padding: var(--content-padding);
  display: flex; flex-direction: column; gap: 24px;
}

/* ── Page Header ──────────────────────────────────────────── */
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.page-header-left h1 {
  font-size: var(--text-2xl);
  font-weight: var(--weight-bold);
  letter-spacing: -0.02em;
  color: var(--text-primary);
}
.page-header-left p {
  font-size: var(--text-sm);
  color: var(--text-muted);
  margin-top: 4px;
}

/* ── Cards ────────────────────────────────────────────────── */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  overflow: hidden;
}

.card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 24px; border-bottom: 1px solid var(--border);
  flex-wrap: wrap; gap: 12px;
}
.card-header h2 {
  font-size: var(--text-lg); font-weight: var(--weight-semibold);
  color: var(--text-primary); letter-spacing: -0.01em;
}
.card-body { padding: 24px; }

/* btn-sm-link */
.btn-sm-link {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: var(--radius-md);
  font-size: var(--text-sm); font-weight: var(--weight-medium);
  color: var(--text-secondary); background: var(--bg-elevated);
  border: 1px solid var(--border); text-decoration: none;
  transition: var(--transition-base);
}
.btn-sm-link svg { width: 14px; height: 14px; }
.btn-sm-link:hover { background: var(--bg-overlay); color: var(--text-primary); border-color: var(--border-strong); }

/* ── Course Grid (view cursos) ────────────────────────────── */
.course-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 18px;
}

.course-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 22px;
  display: flex; flex-direction: column; gap: 14px;
  transition: var(--transition-smooth);
  position: relative;
  overflow: hidden;
}
.course-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--gradient-primary);
  opacity: 0;
  transition: var(--transition-smooth);
}
.course-card:hover { border-color: var(--border-strong); transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.course-card:hover::before { opacity: 1; }

.course-nivel { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: var(--radius-full);
  font-size: var(--text-xs); font-weight: var(--weight-semibold);
  letter-spacing: 0.03em; text-transform: uppercase;
}
.badge-basico        { background: var(--info-subtle);    color: var(--info);    border: 1px solid var(--info-border); }
.badge-intermediario { background: var(--warning-subtle); color: var(--warning); border: 1px solid var(--warning-border); }
.badge-avancado      { background: var(--danger-subtle);  color: var(--danger);  border: 1px solid var(--danger-border); }
.badge-success       { background: var(--success-subtle); color: var(--success); border: 1px solid var(--success-border); }

.course-card h3 {
  font-size: var(--text-md); font-weight: var(--weight-semibold);
  color: var(--text-primary); line-height: var(--leading-snug);
}
.course-card p { font-size: var(--text-sm); color: var(--text-secondary); line-height: var(--leading-normal); }
.course-card small { font-size: var(--text-xs); color: var(--text-muted); display: flex; align-items: center; gap: 4px; }

.progress-bar { height: 6px; background: var(--border); border-radius: var(--radius-full); overflow: hidden; }
.progress-fill {
  height: 100%; background: var(--gradient-primary);
  border-radius: var(--radius-full);
  transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}

/* course actions */
.course-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

.btn-action {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: var(--radius-md);
  font-family: var(--font-sans); font-size: var(--text-sm);
  font-weight: var(--weight-medium); cursor: pointer;
  border: none; text-decoration: none;
  transition: var(--transition-smooth);
}
.btn-action svg { width: 14px; height: 14px; }

.btn-action-primary {
  background: var(--gradient-primary);
  color: #fff;
  box-shadow: var(--shadow-primary);
}
.btn-action-primary:hover { filter: brightness(1.12); transform: translateY(-1px); }

.btn-action-danger {
  background: var(--danger-subtle);
  color: var(--danger);
  border: 1px solid var(--danger-border);
}
.btn-action-danger:hover { background: var(--danger); color: #fff; }

.btn-action-enroll {
  background: var(--success-subtle);
  color: var(--success);
  border: 1px solid var(--success-border);
}
.btn-action-enroll:hover { background: var(--success); color: #fff; }

/* ── View Aulas ───────────────────────────────────────────── */
.curso-meta {
  font-size: var(--text-md);
  color: var(--text-secondary);
  line-height: var(--leading-normal);
  margin-bottom: 20px;
}

/* table */
.table-wrap {
  overflow-x: auto;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
}

.table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--text-sm);
}
.table thead tr {
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
}
.table th {
  padding: 12px 16px;
  text-align: left;
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  white-space: nowrap;
}
.table td {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  vertical-align: top;
}
.table tbody tr:last-child td { border-bottom: none; }
.table tbody tr { transition: var(--transition-fast); }
.table tbody tr:hover td { background: var(--bg-hover); color: var(--text-primary); }

.table td strong { color: var(--text-primary); font-weight: var(--weight-semibold); display: block; margin-bottom: 4px; }
.table td small { font-size: var(--text-xs); color: var(--text-muted); display: block; margin-top: 2px; }

/* btn inline na tabela */
.btn-table {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 12px; border-radius: var(--radius-sm);
  font-family: var(--font-sans); font-size: var(--text-xs);
  font-weight: var(--weight-medium); cursor: pointer; border: none;
  text-decoration: none; transition: var(--transition-base); margin-top: 6px;
}
.btn-table svg { width: 12px; height: 12px; }
.btn-table-video   { background: var(--info-subtle);    color: var(--info);    border: 1px solid var(--info-border); }
.btn-table-file    { background: var(--warning-subtle); color: var(--warning); border: 1px solid var(--warning-border); }
.btn-table-primary { background: var(--gradient-primary); color: #fff; box-shadow: 0 2px 8px rgba(79,124,255,0.3); }
.btn-table-done    { background: var(--bg-elevated); color: var(--text-muted); border: 1px solid var(--border); }
.btn-table-video:hover   { background: var(--info);    color: #fff; }
.btn-table-file:hover    { background: var(--warning); color: #fff; }

/* empty state */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 12px;
  padding: 48px 24px; text-align: center; color: var(--text-secondary);
}
.empty-icon {
  width: 52px; height: 52px; border-radius: var(--radius-full);
  background: var(--primary-subtle); border: 1px solid var(--primary-border);
  display: flex; align-items: center; justify-content: center; color: var(--primary);
}
.empty-icon svg { width: 24px; height: 24px; }

/* loading skeleton */
.skeleton-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 18px; }
.skeleton-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.skeleton-line { height: 12px; border-radius: var(--radius-full); background: linear-gradient(90deg, var(--bg-overlay) 25%, var(--border) 50%, var(--bg-overlay) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
.skeleton-line.short { width: 40%; }
.skeleton-line.medium { width: 70%; }
.skeleton-line.tall { height: 48px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* ── Star Rating ──────────────────────────────────────────── */
.star-display {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: var(--text-sm); color: var(--text-muted);
}
.star-display .stars { color: #f59e0b; letter-spacing: 1px; font-size: 14px; }
.star-display .media-val { font-weight: var(--weight-semibold); color: var(--text-primary); margin-left: 4px; }
.star-display .total-val { font-size: var(--text-xs); color: var(--text-muted); }

.star-selector {
  display: flex; gap: 6px; justify-content: center; margin: 4px 0;
}
.star-selector button {
  background: none; border: none; cursor: pointer;
  font-size: 32px; color: var(--border-strong);
  transition: color 0.15s, transform 0.1s;
  padding: 2px; line-height: 1;
}
.star-selector button.active,
.star-selector button.hovered { color: #f59e0b; transform: scale(1.15); }

/* ── Review Modal ─────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.65); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }

.modal-box {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  width: 100%; max-width: 480px;
  box-shadow: var(--shadow-xl);
  overflow: hidden;
  transform: translateY(16px);
  transition: transform 0.25s ease;
}
.modal-overlay.open .modal-box { transform: translateY(0); }

.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 24px; border-bottom: 1px solid var(--border);
}
.modal-header h3 {
  font-size: var(--text-lg); font-weight: var(--weight-semibold);
  color: var(--text-primary); letter-spacing: -0.01em;
}
.modal-close {
  background: none; border: none; cursor: pointer;
  color: var(--text-muted); padding: 4px; border-radius: var(--radius-sm);
  transition: var(--transition-base); display: flex;
}
.modal-close:hover { color: var(--text-primary); background: var(--bg-hover); }
.modal-close svg { width: 18px; height: 18px; }

.modal-body { padding: 24px; display: flex; flex-direction: column; gap: 18px; }

.modal-body label {
  display: block; font-size: var(--text-sm); font-weight: var(--weight-medium);
  color: var(--text-secondary); margin-bottom: 8px;
}

.modal-body textarea {
  width: 100%; background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: var(--radius-md); color: var(--text-primary);
  font-family: var(--font-sans); font-size: var(--text-sm);
  padding: 10px 12px; resize: vertical; min-height: 80px;
  outline: none; transition: var(--transition-base);
}
.modal-body textarea:focus {
  border-color: var(--border-focus); background: var(--bg-overlay);
  box-shadow: 0 0 0 3px var(--primary-glow);
}
.modal-body textarea::placeholder { color: var(--text-muted); }

.modal-footer {
  display: flex; gap: 10px; justify-content: flex-end;
  padding: 16px 24px; border-top: 1px solid var(--border);
}
.btn-modal-cancel {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 18px; background: var(--bg-elevated);
  border: 1px solid var(--border); border-radius: var(--radius-md);
  color: var(--text-secondary); font-family: var(--font-sans);
  font-size: var(--text-sm); font-weight: var(--weight-medium);
  cursor: pointer; transition: var(--transition-base);
}
.btn-modal-cancel:hover { background: var(--bg-overlay); color: var(--text-primary); }
.btn-modal-submit {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 20px; background: var(--gradient-primary);
  border: none; border-radius: var(--radius-md); color: #fff;
  font-family: var(--font-sans); font-size: var(--text-sm);
  font-weight: var(--weight-semibold); cursor: pointer;
  box-shadow: var(--shadow-primary); transition: var(--transition-smooth);
}
.btn-modal-submit:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn-modal-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; filter: none; }
.btn-modal-submit svg { width: 14px; height: 14px; }

/* ── Review list (inside course lessons view) ─────────────── */
.reviews-section {
  margin-top: 28px; border-top: 1px solid var(--border); padding-top: 24px;
}
.reviews-section h3 {
  font-size: var(--text-md); font-weight: var(--weight-semibold);
  color: var(--text-primary); margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.reviews-list { display: flex; flex-direction: column; gap: 12px; }
.review-item {
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 14px 18px;
}
.review-item-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 6px; gap: 8px; flex-wrap: wrap;
}
.review-item-name {
  font-size: var(--text-sm); font-weight: var(--weight-semibold);
  color: var(--text-primary);
}
.review-item-meta {
  font-size: var(--text-xs); color: var(--text-muted);
  display: flex; align-items: center; gap: 6px;
}
.review-item-stars { color: #f59e0b; letter-spacing: 1px; font-size: 13px; }
.review-item-comment {
  font-size: var(--text-sm); color: var(--text-secondary);
  line-height: var(--leading-normal); margin-top: 4px;
}
.review-empty {
  text-align: center; color: var(--text-muted); font-size: var(--text-sm);
  padding: 24px 0; font-style: italic;
}

/* btn-action-review */
.btn-action-review {
  background: var(--warning-subtle);
  color: var(--warning);
  border: 1px solid var(--warning-border);
}
.btn-action-review:hover { background: var(--warning); color: #fff; }

/* ── Responsive ───────────────────────────────────────────── */
@media (max-width: 900px) {
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0;
    transform: translateX(-100%); box-shadow: var(--shadow-xl);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-toggle { display: flex; }
  .content { padding: 16px; padding-top: 68px; }
}
@media (max-width: 600px) {
  .course-grid { grid-template-columns: 1fr; }
  .card-body { padding: 16px; }
}
</style>
</head>
<body>

<button class="sidebar-toggle" id="sidebarToggle">
  <i data-lucide="menu"></i>
</button>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<!-- ── Sidebar ─────────────────────────────────────────────────── -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <h2>EduvFinance</h2>
    <p class="site-sub">Educação Financeira</p>
  </div>

  <div class="sidebar-user">
    <div class="user-avatar" id="userAvatar">U</div>
    <div class="sidebar-user-info">
      <div class="user-name" id="userName"></div>
      <div class="user-role">Aluno</div>
    </div>
  </div>

  <ul class="sidebar-menu">
    <li>
      <a href="student.html">
        <i data-lucide="layout-dashboard"></i>
        <span>Dashboard</span>
      </a>
    </li>
    <li class="active">
      <a href="aluno_cursos.html">
        <i data-lucide="book-open"></i>
        <span>Cursos</span>
      </a>
    </li>
    <li>
      <a href="aluno_trilha.html">
        <i data-lucide="map"></i>
        <span>Trilhas</span>
      </a>
    </li>
    <li>
      <a href="aluno_simulador.html">
        <i data-lucide="trending-up"></i>
        <span>Simulador</span>
      </a>
    </li>
  </ul>

  <div class="sidebar-footer">
    <button onclick="logout()" class="btn-logout">
      <i data-lucide="log-out"></i>
      <span>Sair</span>
    </button>
  </div>
</nav>

<!-- ── Main ────────────────────────────────────────────────────── -->
<main class="content">

  <!-- ── View: lista de cursos ── -->
  <div id="viewCursos">
    <div class="page-header" style="margin-bottom:0">
      <div class="page-header-left">
        <h1>Cursos</h1>
        <p>Explore e matricule-se nos cursos disponíveis</p>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <!-- skeleton enquanto carrega -->
        <div class="skeleton-grid" id="cursosLoading">
          <div class="skeleton-card"><div class="skeleton-line short"></div><div class="skeleton-line tall"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div>
          <div class="skeleton-card"><div class="skeleton-line short"></div><div class="skeleton-line tall"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div>
          <div class="skeleton-card"><div class="skeleton-line short"></div><div class="skeleton-line tall"></div><div class="skeleton-line medium"></div><div class="skeleton-line short"></div></div>
        </div>
        <div class="course-grid" id="cursosGrid" style="display:none"></div>
      </div>
    </div>
  </div>

  <!-- ── View: aulas do curso ── -->
  <div id="viewAulas" style="display:none">
    <div class="card">
      <div class="card-header">
        <div style="display:flex;flex-direction:column;gap:4px">
          <h2 id="cursoTitulo"></h2>
          <div id="cursoRatingHeader"></div>
        </div>
        <a href="aluno_cursos.html" class="btn-sm-link">
          <i data-lucide="arrow-left"></i>
          Voltar aos cursos
        </a>
      </div>
      <div class="card-body">
        <p class="curso-meta" id="cursoDescricao"></p>
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Aula</th>
                <th>Nível</th>
                <th>Status</th>
                <th>Ação</th>
              </tr>
            </thead>
            <tbody id="aulasBody"></tbody>
          </table>
        </div>

        <!-- Review action + listing -->
        <div class="reviews-section" id="reviewsSection">
          <h3>
            <i data-lucide="star" style="width:18px;height:18px;color:#f59e0b"></i>
            Avaliações
          </h3>
          <div id="reviewActionArea"></div>
          <div class="reviews-list" id="reviewsList"></div>
        </div>
      </div>
    </div>
  </div>

</main>

<!-- ── Review Modal ───────────────────────────────────────────── -->
<div class="modal-overlay" id="reviewModal" role="dialog" aria-modal="true" aria-labelledby="reviewModalTitle">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="reviewModalTitle">Avaliar Curso</h3>
      <button class="modal-close" id="reviewModalClose" aria-label="Fechar">
        <i data-lucide="x"></i>
      </button>
    </div>
    <div class="modal-body">
      <div>
        <label>Sua nota <span style="color:var(--danger)">*</span></label>
        <div class="star-selector" id="starSelector" role="radiogroup" aria-label="Selecione uma nota de 1 a 5 estrelas">
          <button type="button" data-value="1" aria-label="1 estrela">★</button>
          <button type="button" data-value="2" aria-label="2 estrelas">★</button>
          <button type="button" data-value="3" aria-label="3 estrelas">★</button>
          <button type="button" data-value="4" aria-label="4 estrelas">★</button>
          <button type="button" data-value="5" aria-label="5 estrelas">★</button>
        </div>
        <div id="ratingError" style="font-size:var(--text-xs);color:var(--danger);margin-top:4px;display:none">
          Por favor, selecione uma nota.
        </div>
      </div>
      <div>
        <label for="reviewComment">Comentário <span style="color:var(--text-muted);font-weight:400">(opcional)</span></label>
        <textarea id="reviewComment" maxlength="2000" placeholder="Compartilhe sua experiência com o curso..."></textarea>
        <span style="font-size:var(--text-xs);color:var(--text-muted)">Máximo 2000 caracteres.</span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-modal-cancel" id="reviewModalCancelBtn">Cancelar</button>
      <button class="btn-modal-submit" id="reviewModalSubmitBtn">
        <i data-lucide="send"></i>
        Enviar avaliação
      </button>
    </div>
  </div>
</div>

<!-- ── Scripts ────────────────────────────────────────────────── -->
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/aluno.js"></script>
<script src="../assets/js/reviews.js"></script>
<script>
lucide.createIcons();

/* sidebar mobile */
const sidebarToggle   = document.getElementById('sidebarToggle');
const sidebar         = document.getElementById('sidebar');
const sidebarBackdrop = document.getElementById('sidebarBackdrop');

sidebarToggle.addEventListener('click', () => {
  sidebar.classList.toggle('open');
  sidebarBackdrop.classList.toggle('visible');
});
sidebarBackdrop.addEventListener('click', () => {
  sidebar.classList.remove('open');
  sidebarBackdrop.classList.remove('visible');
});

/* sessão */
verificarSessao('aluno', usuario => {
  document.getElementById('userName').textContent = usuario.nome;

  const inicial = usuario.nome ? usuario.nome.charAt(0).toUpperCase() : 'U';
  document.getElementById('userAvatar').textContent = inicial;

  const params  = new URLSearchParams(window.location.search);
  const sucesso = params.get('sucesso');
  const erro    = params.get('erro');
  const cursoId = params.get('curso');

  if (sucesso) exibirToast(sucesso, 'success');
  if (erro)    exibirToast(erro, 'error');

  if (cursoId) {
    document.getElementById('viewCursos').style.display = 'none';
    document.getElementById('viewAulas').style.display  = 'block';
    carregarAulasDoCurso(parseInt(cursoId));
  } else {
    carregarCursos().then(() => {
      document.getElementById('cursosLoading').style.display = 'none';
      document.getElementById('cursosGrid').style.display    = 'grid';
      lucide.createIcons();
    });
  }
});
</script>
</body>
</html>
