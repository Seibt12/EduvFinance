<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprovar Aulas — EduvFinance</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <div class="sidebar-logo"><h2>EduvFinance</h2></div>
    <ul class="sidebar-menu">
      <li><a href="index.html">Dashboard</a></li>
      <li><a href="admin_alunos.html">Alunos</a></li>
      <li><a href="admin_professores.html">Professores</a></li>
      <li><a href="admin_cursos.html">Aprovar Cursos</a></li>
      <li class="active"><a href="admin_aulas.html">Aprovar Aulas</a></li>
    </ul>
    <div class="sidebar-footer">
      <span id="userName"></span>
      <button onclick="logout()" class="btn btn-sm">Sair</button>
    </div>
  </nav>

  <main class="content">
    <div class="page-header">
      <h1>Aprovar Ofertas de Aulas</h1>
      <p class="page-subtitle">Analise aulas enviadas pelos professores, incluindo vídeos e materiais anexos.</p>
    </div>

    <div class="card" id="cardAnaliseAula" style="display:none">
      <div class="card-header">
        <h2>Detalhes da Oferta</h2>
        <button type="button" class="btn btn-sm" onclick="fecharAnaliseAula()">Fechar</button>
      </div>
      <div class="card-body">
        <div id="analiseAulaConteudo"></div>
        <input type="hidden" id="analiseAulaId">
        <div class="form-actions" style="margin-top:1rem">
          <form method="POST" action="../php/admin_professor_lessons_aprovar.php" style="display:inline"
                onsubmit="return confirm('Aprovar e publicar esta aula?')">
            <input type="hidden" name="id" id="inputAprovarAulaId">
            <button type="submit" class="btn btn-primary" id="btnAprovarAula"
                    onclick="document.getElementById('inputAprovarAulaId').value=document.getElementById('analiseAulaId').value">Aprovar</button>
          </form>
        </div>
        <form method="POST" action="../php/admin_professor_lessons_rejeitar.php" id="formRejeitarAula" style="margin-top:1rem;display:none">
          <input type="hidden" name="id" id="inputRejeitarAulaId">
          <div class="form-group">
            <label>Motivo da rejeição</label>
            <textarea name="review_comment" rows="3" required placeholder="Descreva o que precisa ser ajustado..."></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-danger"
                    onclick="document.getElementById('inputRejeitarAulaId').value=document.getElementById('analiseAulaId').value">Rejeitar</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>Ofertas (<span id="contadorOfertasAulas">0</span>)</h2>
        <select id="filtroStatusAulas" class="form-control" style="max-width:200px" onchange="carregarOfertasAulasAdmin()">
          <option value="pendente" selected>Pendentes</option>
          <option value="aprovado">Aprovados</option>
          <option value="rejeitado">Rejeitados</option>
          <option value="todos">Todos</option>
        </select>
      </div>
      <div class="card-body">
        <table class="table">
          <thead>
            <tr><th>Aula</th><th>Professor</th><th>Nível</th><th>Status</th><th>Enviada em</th><th>Ações</th></tr>
          </thead>
          <tbody id="ofertasAulasBody">
            <tr><td colspan="6" class="empty-state">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/utils.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/admin_aprovacoes.js"></script>
<script>
verificarSessao('admin', usuario => {
  document.getElementById('userName').textContent = usuario.nome;
  const params = new URLSearchParams(window.location.search);
  if (params.get('sucesso')) exibirToast(params.get('sucesso'), 'success');
  if (params.get('erro'))    exibirToast(params.get('erro'), 'error');
  carregarOfertasAulasAdmin();
});
</script>
</body>
</html>
