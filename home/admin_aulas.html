<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerenciar Aulas — EduvFinance</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <div class="sidebar-logo"><h2>EduvFinance</h2></div>
    <ul class="sidebar-menu">
      <li><a href="index.html">Dashboard</a></li>
      <li><a href="admin_alunos.html">Alunos</a></li>
      <li class="active"><a href="admin_aulas.html">Aulas</a></li>
      <li><a href="admin_cursos.html">Cursos</a></li>
    </ul>
    <div class="sidebar-footer">
      <span id="userName"></span>
      <button onclick="logout()" class="btn btn-sm">Sair</button>
    </div>
  </nav>

  <main class="content">
    <div class="page-header">
      <h1>Gerenciar Aulas</h1>
    </div>

    <div class="card">
      <div class="card-header">
        <h2 id="cardTituloAula">Nova Aula</h2>
      </div>
      <div class="card-body">
        <form method="POST" action="../php/lessons_inserir.php" id="formAulaEl">
          <input type="hidden" name="id" id="formAulaId">
          <input type="hidden" name="_action" id="formAulaAction" value="criar">
          <div class="form-group">
            <label>Título</label>
            <input type="text" name="titulo" id="formAulaTitulo" required>
          </div>
          <div class="form-group">
            <label>Descrição</label>
            <textarea name="descricao" id="formAulaDescricao" rows="3" required></textarea>
          </div>
          <div class="form-group">
            <label>Nível</label>
            <select name="nivel" id="formAulaNivel" required>
              <option value="">Selecione...</option>
              <option value="basico">Básico</option>
              <option value="intermediario">Intermediário</option>
              <option value="avancado">Avançado</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="btnSubmitAula">Criar Aula</button>
            <button type="button" class="btn" id="btnCancelarAula" onclick="cancelarEdicaoAula()" style="display:none">Cancelar</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>Lista de Aulas (<span id="contadorAulas">0</span>)</h2>
      </div>
      <div class="card-body">
        <table class="table">
          <thead>
            <tr><th>Título</th><th>Nível</th><th>Criada em</th><th>Ações</th></tr>
          </thead>
          <tbody id="aulasBody">
            <tr><td colspan="4" class="empty-state">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/utils.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
verificarSessao('admin', usuario => {
  document.getElementById('userName').textContent = usuario.nome;

  const params  = new URLSearchParams(window.location.search);
  const sucesso = params.get('sucesso');
  const erro    = params.get('erro');
  if (sucesso) exibirToast(sucesso, 'success');
  if (erro)    exibirToast(erro, 'error');

  carregarAulas();
});
</script>
</body>
</html>
