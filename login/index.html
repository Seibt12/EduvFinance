<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — EduvFinance</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="auth-container">
  <div class="auth-box">
    <div class="auth-logo">
      <h1>EduvFinance</h1>
      <p>Educação Financeira</p>
    </div>

    <div id="loginAlert" class="alert alert-error" style="display:none"></div>
    <div id="loginSucesso" class="alert alert-success" style="display:none"></div>

    <form method="POST" action="../php/login.php">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-full">Entrar</button>
    </form>

    <p class="auth-link">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
  </div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const erro   = params.get('erro');
const sucesso = params.get('sucesso');
if (erro)   { const el = document.getElementById('loginAlert');  el.textContent = erro;   el.style.display = 'block'; }
if (sucesso) { const el = document.getElementById('loginSucesso'); el.textContent = sucesso; el.style.display = 'block'; }
</script>
</body>
</html>
